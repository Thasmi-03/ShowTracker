<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show Details - ShowTrackr</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/details.css">
</head>

<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-transparent fixed-top glass-nav">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        Show<b>Trackr</b>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll"
        aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarScroll">
        <ul class="navbar-nav me-auto my-2 my-lg-0 navbar-nav-scroll">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="add.html">Add Show</a>
          </li>
        </ul>
        <form class="d-flex gap-2" role="search">
          <a href="login.html" class="btn btn-outline-light rounded-pill px-4 btn-sm">Login</a>
          <a href="Signup.html" class="btn btn-primary rounded-pill px-4 btn-sm">Sign Up</a>
        </form>
      </div>
    </div>
  </nav>

  <div class="container page-content">
    <div class="glass-panel p-4 mb-5" id="detail-card">
      <div class="row g-4">
        <!-- Image Section -->
        <div class="col-md-4 col-lg-3 text-center">
          <div class="img-container mb-3">
            <img src="" class="img-fluid rounded-3 shadow-lg" alt="Show Cover" id="detail-img"
              onerror="this.src='https://via.placeholder.com/300x450?text=No+Image'">
          </div>
          <button class="btn btn-outline-primary w-100 mb-2" id="btn-login">Login to subscribe</button>
          <div class="d-grid gap-2">
            <button id="editBtn" class="btn btn-warning btn-sm">Edit Show</button>
            <button id="deleteBtn" class="btn btn-danger btn-sm">Delete Show</button>
          </div>
        </div>

        <!-- Details Section -->
        <div class="col-md-8 col-lg-9">
          <div class="d-flex justify-content-between align-items-start mb-3 border-bottom border-secondary pb-2">
            <h1 class="display-5 fw-bold mb-0" id="show-title">Show Title</h1>
            <h2 class="text-warning mb-0" id="show-rating">&#x2764 0.0</h2>
          </div>

          <div class="d-flex gap-4 mb-4 text-secondary">
            <span id="show-episodes"><i class="bi bi-collection-play me-1"></i> 0 Episodes</span>
            <span id="show-schedule"><i class="bi bi-calendar-event me-1"></i> Schedule N/A</span>
          </div>

          <h5 class="text-light mb-3">Synopsis</h5>
          <p class="lead fs-6 text-light opacity-75" id="show-description">
            No description available.
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>
  <script src="js/details.js"></script>
</body>

</html>
